<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antennekaart NL</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f8f9fa;--surface:#ffffff;--surface2:#f0f1f3;--border:#e0e3e8;
  --text:#1a1d27;--text2:#4a5568;--text3:#94a3b8;
  --green:#16a34a;--blue:#2563eb;--orange:#d97706;--red:#dc2626;--purple:#7c3aed;--cyan:#0891b2;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
#map{position:absolute;inset:0;z-index:1}
.leaflet-container{background:#f8f9fa!important}
.leaflet-control-zoom{border:none!important;overflow:hidden;border-radius:10px!important;box-shadow:0 1px 6px rgba(0,0,0,.1)!important}
.leaflet-control-zoom a{background:var(--surface)!important;color:var(--text2)!important;border:none!important;width:36px!important;height:36px!important;line-height:36px!important;font-size:16px!important;border-bottom:1px solid var(--border)!important}
.leaflet-control-zoom a:hover{background:var(--surface2)!important;color:var(--text)!important}
.leaflet-control-attribution{background:rgba(255,255,255,.85)!important;color:var(--text3)!important;font-size:10px!important;backdrop-filter:blur(8px)}
.leaflet-control-attribution a{color:var(--text2)!important}

/* Top bar */
.top-bar{position:absolute;top:12px;left:12px;right:12px;z-index:1000;display:flex;gap:10px;align-items:center;pointer-events:none}
.top-bar>*{pointer-events:auto}
.logo{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 14px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;letter-spacing:-.3px;backdrop-filter:blur(12px);white-space:nowrap}
.logo .dot{width:8px;height:8px;background:var(--green);border-radius:50%;animation:blink 3s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.search-wrap{flex:1;max-width:400px;position:relative}
.search-wrap input{width:100%;padding:10px 14px 10px 38px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font:14px 'Inter',sans-serif;outline:none;backdrop-filter:blur(12px);transition:border-color .2s}
.search-wrap input:focus{border-color:var(--blue)}
.search-wrap input::placeholder{color:var(--text3)}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);width:16px;height:16px}
.zoom-hint{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-size:12px;color:var(--text2);backdrop-filter:blur(12px);display:none;align-items:center;gap:6px}
.zoom-hint.show{display:flex}

/* Filter chips */
.filters{position:absolute;bottom:12px;left:12px;z-index:1000;display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px;cursor:pointer;transition:all .15s;user-select:none;backdrop-filter:blur(12px);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.chip:hover{background:var(--surface2)}
.chip.off{opacity:.35}
.chip .cd{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.chip .count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3)}
.chip-total{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text2);backdrop-filter:blur(12px)}

/* Loading */
.loader{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:1000;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:12px;color:var(--text2);display:none;align-items:center;gap:8px;backdrop-filter:blur(12px)}
.loader.on{display:flex}
.loader .sp{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite}
.loader{box-shadow:0 1px 6px rgba(0,0,0,.08)}
@keyframes spin{to{transform:rotate(360deg)}}

/* Detail panel */
.panel{position:absolute;top:0;right:0;width:380px;height:100vh;background:var(--surface);border-left:1px solid var(--border);z-index:1000;transform:translateX(100%);transition:transform .3s cubic-bezier(.16,1,.3,1);overflow-y:auto;overflow-x:hidden}
.panel.open{transform:none}
.panel::-webkit-scrollbar{width:5px}
.panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.panel{box-shadow:-4px 0 20px rgba(0,0,0,.08)}
.ph{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;z-index:1}
.ph h2{font-size:15px;font-weight:700;line-height:1.3}
.ph small{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3);display:block;margin-top:3px}
.ph button{background:none;border:1px solid var(--border);color:var(--text2);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ph button:hover{background:var(--surface2);color:var(--text)}
.pb{padding:14px 16px}

/* Tags */
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;padding:3px 8px;border-radius:4px;letter-spacing:.5px}
.tag.g5{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.tag.g4{background:rgba(59,130,246,.1);color:var(--blue);border:1px solid rgba(59,130,246,.2)}
.tag.g3{background:rgba(245,158,11,.1);color:var(--orange);border:1px solid rgba(245,158,11,.2)}
.tag.g2{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.tag.gv{background:rgba(168,85,247,.1);color:var(--purple);border:1px solid rgba(168,85,247,.2)}

/* Grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:16px}
.cell{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px}
.cell.w{grid-column:1/-1}
.cell label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;font-family:'JetBrains Mono',monospace;display:block;margin-bottom:2px}
.cell span{font-size:13px;font-weight:500}

/* Antenna cards */
.sec{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;font-family:'JetBrains Mono',monospace;margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.acard{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:6px}
.acard-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.acard-type{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600}
.acard-dir{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3)}
.acard-specs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;text-align:center}
.acard-specs .v{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600}
.acard-specs .l{font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-top:1px}

@media(max-width:768px){.panel{width:100vw}.logo span{display:none}.search-wrap{max-width:none}}
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo"><span class="dot"></span><span>📡 Antennekaart NL</span></div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="search" type="text" placeholder="Zoek postcode of stad..." autocomplete="off">
  </div>
  <div class="zoom-hint" id="zoomHint">📍 Zoom in om antennes te zien</div>
</div>

<div class="loader" id="loader"><div class="sp"></div>Laden...</div>

<div class="filters" id="filters"></div>

<div id="map"></div>

<div class="panel" id="panel">
  <div class="ph">
    <div><h2 id="pTitle"></h2><small id="pSub"></small></div>
    <button onclick="closePanel()">✕</button>
  </div>
  <div class="pb" id="pBody"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ═══ RD ↔ WGS84 ═══
const RD={x0:155000.04,y0:463000.05,p0:52.15517440,l0:5.38720621,
toWGS(x,y){const dx=(x-this.x0)*1e-5,dy=(y-this.y0)*1e-5;
const Kp=[0,2,0,2,0,2,1,4,2,4,1],Kq=[1,0,2,1,3,2,0,0,3,1,1],
Kv=[3235.65389,-32.58297,-.2475,-.84978,-.0655,-.01709,-.00738,.0053,-.00039,.00033,-.00012],
Lp=[1,1,1,3,1,3,0,3,1,0,2,5],Lq=[0,1,2,0,3,1,1,2,4,2,0,0],
Lv=[5260.52916,105.94684,2.45089,-.81885,.05594,-.05607,.01199,-.00256,.00128,.00022,-.00022,.00026];
let p=0,l=0;for(let i=0;i<Kv.length;i++)p+=Kv[i]*dx**Kp[i]*dy**Kq[i];
for(let i=0;i<Lv.length;i++)l+=Lv[i]*dx**Lp[i]*dy**Lq[i];return[this.p0+p/3600,this.l0+l/3600]},
fromWGS(lat,lon){const dp=.36*(lat-this.p0),dl=.36*(lon-this.l0);
const Rp=[0,1,2,0,1,3,1,0,2],Rq=[1,1,1,3,0,1,3,2,3],
Rv=[190094.945,-11832.228,-114.221,-32.391,-.705,-2.34,-.608,-.008,.148],
Sp=[1,0,2,1,3,0,2,1,0,1],Sq=[0,2,0,2,0,1,2,1,4,4],
Sv=[309056.544,3638.893,72.971,-157.984,59.788,.433,-6.439,-.032,.092,-.054];
let x=0,y=0;for(let i=0;i<Rv.length;i++)x+=Rv[i]*dp**Rp[i]*dl**Rq[i];
for(let i=0;i<Sv.length;i++)y+=Sv[i]*dp**Sp[i]*dl**Sq[i];return[this.x0+x,this.y0+y]}};

const TECHS={
  '5G':{color:'#22c55e',cls:'g5'},
  '4G':{color:'#3b82f6',cls:'g4'},
  '3G':{color:'#f59e0b',cls:'g3'},
  '2G':{color:'#ef4444',cls:'g2'},
  'VV':{color:'#a855f7',cls:'gv'},
};

function primaryTech(p){
  if(p.VIJFG>0)return'5G';if(p.VIERG>0)return'4G';
  if(p.DRIEG>0)return'3G';if(p.TWEEG>0)return'2G';
  const h=(p.HOOFDSOORT||'').toUpperCase();
  if(h.includes('VAST')||h==='VV')return'VV';return'OTHER';
}

function satColor(s){
  if(!s)return'#636b7e';s=s.toUpperCase();
  if(s.includes('5G'))return'#22c55e';if(s.includes('LTE'))return'#3b82f6';
  if(s.includes('UMTS'))return'#f59e0b';if(s.includes('GSM'))return'#ef4444';
  if(s.includes('VV')||s.includes('VAST'))return'#a855f7';return'#636b7e';
}

function satCls(s){
  if(!s)return'';s=s.toUpperCase();
  if(s.includes('5G'))return'g5';if(s.includes('LTE'))return'g4';
  if(s.includes('UMTS'))return'g3';if(s.includes('GSM'))return'g2';
  if(s.includes('VV')||s.includes('VAST'))return'gv';return'';
}

// ═══ MAP ═══
const map=L.map('map',{center:[52.09,5.12],zoom:13,zoomControl:true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{
  subdomains:'abcd',maxZoom:19,
  attribution:'© <a href="https://osm.org/copyright">OSM</a> · <a href="https://carto.com">CARTO</a> · Data: <a href="https://antenneregister.nl">Antenneregister</a>'
}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',{
  subdomains:'abcd',maxZoom:19,pane:'shadowPane'
}).addTo(map);

const markers=L.layerGroup().addTo(map);
let active=new Set(['5G','4G','3G','2G','VV','OTHER','ALL']);
let stats={total:0,'5G':0,'4G':0,'3G':0,'2G':0,'VV':0};
let loadTimer=null;

function icon(tech,n){
  const c=TECHS[tech]?.color||'#636b7e';
  const s=n>5?26:n>2?22:18;
  return L.divIcon({className:'',iconSize:[s,s],iconAnchor:[s/2,s/2],
    html:`<div style="width:${s}px;height:${s}px;background:${c}18;border:2px solid ${c};border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 ${s<22?9:10}px 'JetBrains Mono',monospace;color:${c};box-shadow:0 0 8px ${c}40;cursor:pointer">${n>1?n:''}</div>`});
}

// ═══ FETCH ═══
async function loadAntennas(){
  const z=map.getZoom();
  document.getElementById('zoomHint').classList.toggle('show',z<11);
  if(z<11){markers.clearLayers();updateFilters({});return}

  document.getElementById('loader').classList.add('on');
  try{
    const b=map.getBounds(),sw=b.getSouthWest(),ne=b.getNorthEast();
    const[x1,y1]=RD.fromWGS(sw.lat,sw.lng),[x2,y2]=RD.fromWGS(ne.lat,ne.lng);
    const bbox=`${Math.floor(x1)},${Math.floor(y1)},${Math.ceil(x2)},${Math.ceil(y2)}`;
    const r=await fetch(`https://antenneregister.nl/mapserver/wfs/?service=WFS&version=2.0.0&request=GetFeature&typeName=ms:Antennes&outputFormat=application/json&bbox=${bbox}&count=800`);
    const data=await r.json();
    const feats=data.features||[];

    markers.clearLayers();
    const s={total:feats.length,'5G':0,'4G':0,'3G':0,'2G':0,'VV':0};

    feats.forEach(f=>{
      const p=f.properties,t=primaryTech(p);
      const[lat,lon]=RD.toWGS(p.X,p.Y);
      if(p.VIJFG>0)s['5G']++;if(p.VIERG>0)s['4G']++;
      if(p.DRIEG>0)s['3G']++;if(p.TWEEG>0)s['2G']++;
      if((p.HOOFDSOORT||'').toUpperCase().includes('VAST'))s['VV']++;
      const tk=t==='OTHER'?'OTHER':t;
      if(!active.has(tk))return;
      const m=L.marker([lat,lon],{icon:icon(t,p.AANTAL||1)});
      m.on('click',()=>showDetail(p,lat,lon));
      markers.addLayer(m);
    });
    updateFilters(s);
  }catch(e){console.error(e)}
  finally{document.getElementById('loader').classList.remove('on')}
}

function scheduleLoad(){clearTimeout(loadTimer);loadTimer=setTimeout(loadAntennas,350)}
map.on('moveend',scheduleLoad);map.on('zoomend',scheduleLoad);

// ═══ FILTERS ═══
function updateFilters(s){
  stats=s;
  const el=document.getElementById('filters');
  const items=[
    {k:'5G',label:'5G',c:'#22c55e'},{k:'4G',label:'4G',c:'#3b82f6'},
    {k:'3G',label:'3G',c:'#f59e0b'},{k:'2G',label:'2G',c:'#ef4444'},
    {k:'VV',label:'Straal',c:'#a855f7'}
  ];
  el.innerHTML=`<div class="chip-total">${s.total||0} sites</div>`+
    items.map(i=>`<div class="chip ${active.has(i.k)?'':'off'}" onclick="toggle('${i.k}')"><span class="cd" style="background:${i.c}"></span>${i.label}<span class="count">${s[i.k]||0}</span></div>`).join('');
}

function toggle(k){if(active.has(k))active.delete(k);else active.add(k);loadAntennas()}

// ═══ DETAIL ═══
async function showDetail(p,lat,lon){
  const panel=document.getElementById('panel');
  document.getElementById('pTitle').textContent=p.WOONPLAATSNAAM||p.GEMEENTE||'Onbekend';
  document.getElementById('pSub').textContent=`${p.POSTCODE||'—'} · ${lat.toFixed(5)}, ${lon.toFixed(5)}`;

  const techs=(p.HOOFDSOORT||'').split(',').map(s=>s.trim()).filter(Boolean);
  const tags=techs.map(t=>`<span class="tag ${satCls(t)}">${t}</span>`).join('');

  const techLine=[p.VIJFG>0?'<b style="color:#22c55e">5G</b>':'',p.VIERG>0?'<b style="color:#3b82f6">4G</b>':'',
    p.DRIEG>0?'<b style="color:#f59e0b">3G</b>':'',p.TWEEG>0?'<b style="color:#ef4444">2G</b>':''].filter(Boolean).join(' · ');

  document.getElementById('pBody').innerHTML=`
    <div class="tags">${tags}</div>
    <div class="grid">
      <div class="cell"><label>Gemeente</label><span>${p.GEMEENTE||'—'}</span></div>
      <div class="cell"><label>Installaties</label><span>${p.AANTAL||'—'}</span></div>
      <div class="cell"><label>Small Cell</label><span>${p.SMALL_CELL_INDICATOR||'Nee'}</span></div>
      <div class="cell"><label>Generaties</label><span>${techLine||'—'}</span></div>
    </div>
    <div class="sec">Antenne-installaties</div>
    <div id="groupsArea"><div style="text-align:center;padding:16px;color:var(--text3);font-size:12px"><div class="sp" style="margin:0 auto 6px;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite"></div>Detail laden...</div></div>`;

  panel.classList.add('open');

  if(p.ANT_IDS){
    try{
      const ids=p.ANT_IDS.split(',').map(s=>s.trim()).filter(Boolean);
      const filter=ids.map(id=>`AI_ID=${id}`).join(' OR ');
      const r=await fetch(`https://antenneregister.nl/mapserver/wfs/?service=WFS&version=2.0.0&request=GetFeature&typeName=ms:Antennes_Groepen&outputFormat=application/json&CQL_FILTER=${encodeURIComponent(filter)}`);
      const data=await r.json();
      const groups=data.features||[];

      if(!groups.length){document.getElementById('groupsArea').innerHTML='<div style="color:var(--text3);font-size:12px;text-align:center;padding:12px">Geen detail data</div>';return}

      const byAid={};groups.forEach(g=>{const a=g.properties.AI_ID;(byAid[a]=byAid[a]||[]).push(g.properties)});

      let html='';
      Object.entries(byAid).forEach(([aid,entries])=>{
        const f=entries[0],c=satColor(f.SAT_CODE);
        html+=`<div class="acard" style="border-left:3px solid ${c}">
          <div class="acard-head">
            <span class="acard-type" style="color:${c}">${f.SAT_CODE||'Onbekend'}</span>
            <span class="acard-dir">${f.DIR_NONDIR==='D'&&f.HOOFDSTRAALRICHTING!=null?f.HOOFDSTRAALRICHTING+'°':f.DIR_NONDIR==='N'?'Omni':''}</span>
          </div>`;
        entries.forEach(e=>{
          html+=`<div class="acard-specs" style="margin-bottom:4px">
            <div><div class="v">${e.FREQUENTIE||'—'}</div><div class="l">Freq</div></div>
            <div><div class="v">${e.ZENDVERMOGEN!=null?e.ZENDVERMOGEN+' dBW':'—'}</div><div class="l">Vermogen</div></div>
            <div><div class="v">${e.HOOGTE!=null?e.HOOGTE+' m':'—'}</div><div class="l">Hoogte</div></div>
          </div>
          <div class="acard-specs">
            <div><div class="v">${e.HOOFDSTRAALRICHTING!=null?e.HOOFDSTRAALRICHTING+'°':'—'}</div><div class="l">Richting</div></div>
            <div><div class="v">${e.VEILIGE_AFSTAND!=null&&e.VEILIGE_AFSTAND>=0?e.VEILIGE_AFSTAND+' m':'—'}</div><div class="l">Veilig</div></div>
            <div><div class="v" style="font-size:10px">${e.DATUM_INGEBRUIKNAME||'—'}</div><div class="l">In gebruik</div></div>
          </div>`;
        });
        html+='</div>';
      });
      document.getElementById('groupsArea').innerHTML=html;
    }catch(e){document.getElementById('groupsArea').innerHTML='<div style="color:var(--red);font-size:12px;text-align:center;padding:12px">Fout bij laden</div>'}
  }
}

function closePanel(){document.getElementById('panel').classList.remove('open')}

// ═══ SEARCH ═══
const si=document.getElementById('search');
let st;
si.addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(st);doSearch(si.value)}});
si.addEventListener('input',()=>{clearTimeout(st);st=setTimeout(()=>doSearch(si.value),600)});

async function doSearch(q){
  if(!q||q.length<2)return;
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q+' Nederland')}&limit=1&countrycodes=nl`);
    const d=await r.json();
    if(d.length)map.setView([+d[0].lat,+d[0].lon],15);
  }catch(e){console.error(e)}
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closePanel();
  if(e.key==='/'&&document.activeElement!==si){e.preventDefault();si.focus()}
});

// Start centered on Utrecht
updateFilters({});
setTimeout(loadAntennas,300);
</script>
</body>
</html>
